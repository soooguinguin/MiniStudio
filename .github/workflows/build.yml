name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -o MiniStudio.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        working-directory: MiniStudio
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Studio build ${{ github.run_number }}
          files: MiniStudio/app/build/outputs/apk/debug/app-debug.apk

